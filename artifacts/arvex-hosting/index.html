    <title>ArveX Hosting</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* ArveX — Coming Soon game cards. Intentionally plain CSS so this does not depend on Tailwind. */
      .coming-soon-card {
        position: relative !important;
        cursor: not-allowed !important;
        opacity: .86 !important;
        border-color: rgba(248, 113, 113, .38) !important;
      }
      .coming-soon-card:hover {
        transform: none !important;
        border-color: rgba(248, 113, 113, .55) !important;
        box-shadow: 0 0 30px rgba(239, 68, 68, .10) !important;
      }
      .coming-soon-badge {
        position: absolute !important;
        top: 14px !important;
        right: 14px !important;
        z-index: 999 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 6px 10px !important;
        border: 1px solid rgba(248, 113, 113, .70) !important;
        border-radius: 999px !important;
        background: rgba(127, 29, 29, .32) !important;
        color: #ff6b6b !important;
        font-family: monospace !important;
        font-size: 9px !important;
        font-weight: 800 !important;
        letter-spacing: .13em !important;
        line-height: 1 !important;
        white-space: nowrap !important;
        box-shadow: 0 0 18px rgba(239, 68, 68, .18) !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* ArveX: Terraria + Project Zomboid are coming soon.
         This guard intentionally works even if the React card markup changes. */
      (function () {
        const games = [
          { slug: 'terraria', label: 'Terraria' },
          { slug: 'project-zomboid', label: 'Project Zomboid' }
        ];

        function findCards(game) {
          const exact = document.querySelectorAll(
            '[data-testid="card-game-' + game.slug + '"], [data-testid="game-select-' + game.slug + '"]'
          );
          if (exact.length) return Array.from(exact);

          return Array.from(document.querySelectorAll('a, button, div')).filter(function (el) {
            if (el.children.length > 12) return false;
            const text = (el.textContent || '').replace(/\s+/g, ' ').trim();
            return text.includes(game.label) && text.includes('SELECT GAME');
          });
        }

        function decorate() {
          games.forEach(function (game) {
            findCards(game).forEach(function (card) {
              card.classList.add('coming-soon-card');
              card.setAttribute('aria-disabled', 'true');
              card.setAttribute('title', game.label + ' — Coming soon');

              if (!card.querySelector('.coming-soon-badge')) {
                const badge = document.createElement('span');
                badge.className = 'coming-soon-badge';
                badge.textContent = 'COMING SOON';
                badge.setAttribute('aria-label', 'Coming soon');
                card.appendChild(badge);
              }
            });
          });
        }

        function block(event) {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;

          const href = target.closest('a[href]')?.getAttribute('href') || '';
          if (/\/services\/game-hosting\/(terraria|project-zomboid)(?:[/?#]|$)/i.test(href)) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return;
          }

          for (const game of games) {
            const cards = findCards(game);
            if (cards.some(function (card) { return card === target || card.contains(target); })) {
              event.preventDefault();
              event.stopPropagation();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return;
            }
          }
        }

        document.addEventListener('click', block, true);
        document.addEventListener('pointerdown', block, true);
        document.addEventListener('auxclick', block, true);
        decorate();
        new MutationObserver(decorate).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
