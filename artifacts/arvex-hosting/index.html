    <style>
      .coming-soon-card {
        position: relative !important;
        cursor: not-allowed !important;
        opacity: .86 !important;
        border-color: rgba(248, 113, 113, .38) !important;
      }
      .coming-soon-card:hover {
        transform: none !important;
        border-color: rgba(248, 113, 113, .55) !important;
        box-shadow: 0 0 30px rgba(239, 68, 68, .10) !important;
      }
      .coming-soon-badge {
        position: absolute !important;
        top: 14px !important;
        right: 14px !important;
        z-index: 999 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        padding: 6px 10px !important;
        border: 1px solid rgba(248, 113, 113, .70) !important;
        border-radius: 999px !important;
        background: rgba(127, 29, 29, .32) !important;
        color: #ff6b6b !important;
        font-family: monospace !important;
        font-size: 9px !important;
        font-weight: 800 !important;
        letter-spacing: .13em !important;
        line-height: 1 !important;
        white-space: nowrap !important;
        box-shadow: 0 0 18px rgba(239, 68, 68, .18) !important;
        pointer-events: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        const comingSoon = {
          terraria: 'Terraria',
          'project-zomboid': 'Project Zomboid'
        };

        const dedicatedRoutes = {
          'ark-survival-ascended': '/services/game-hosting/ark-survival-ascended',
          fivem: '/services/game-hosting/fivem'
        };

        function getCard(slug) {
          return Array.from(document.querySelectorAll(
            '[data-testid="card-game-' + slug + '"], ' +
            '[data-testid="game-select-' + slug + '"]'
          ));
        }

        function decorateComingSoon() {
          Object.keys(comingSoon).forEach(function (slug) {
            getCard(slug).forEach(function (card) {
              card.classList.add('coming-soon-card');
              card.setAttribute('aria-disabled', 'true');
              card.setAttribute('tabindex', '-1');
              card.setAttribute('title', comingSoon[slug] + ' — Coming soon');

              if (!card.querySelector('.coming-soon-badge')) {
                const badge = document.createElement('span');
                badge.className = 'coming-soon-badge';
                badge.textContent = 'COMING SOON';
                badge.setAttribute('aria-label', 'Coming soon');
                card.appendChild(badge);
              }
            });
          });
        }

        function stop(event) {
          event.preventDefault();
          event.stopPropagation();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }

        function handleGameNavigation(event) {
          const target = event.target instanceof Element ? event.target : null;
          if (!target) return;

          const anchor = target.closest('a[href]');
          const button = target.closest('button[data-testid]');

          const href = anchor ? (anchor.getAttribute('href') || '') : '';
          const testId = button ? (button.getAttribute('data-testid') || '') : '';

          // Terraria / Project Zomboid: never allow navigation, whether the
          // card is rendered as a Wouter Link or as a button.
          if (
            /\/services\/game-hosting\/(terraria|project-zomboid)(?:[/?#]|$)/i.test(href) ||
            /^game-select-(terraria|project-zomboid)$/i.test(testId)
          ) {
            stop(event);
            return;
          }

          // ARK ASA / FiveM: force the real dedicated route even when the
          // game selector is rendered as a button and React would otherwise
          // open its generic in-page selector.
          let route = null;

          const routeMatch = href.match(
            /\/services\/game-hosting\/(ark-survival-ascended|fivem)(?:[/?#]|$)/i
          );
          if (routeMatch) route = dedicatedRoutes[routeMatch[1].toLowerCase()];

          const buttonMatch = testId.match(/^game-select-(ark-survival-ascended|fivem)$/i);
          if (buttonMatch) route = dedicatedRoutes[buttonMatch[1].toLowerCase()];

          if (route) {
            stop(event);
            window.location.assign(route);
          }
        }

        // Capture phase runs before Wouter/React click handlers.
        document.addEventListener('click', handleGameNavigation, true);
        document.addEventListener('pointerup', handleGameNavigation, true);
        document.addEventListener('auxclick', handleGameNavigation, true);

        decorateComingSoon();
        new MutationObserver(decorateComingSoon).observe(document.documentElement, {
          childList: true,
          subtree: true
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
