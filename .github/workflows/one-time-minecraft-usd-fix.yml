name: One-time Minecraft USD display fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'fix: Minecraft USD display')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch only Minecraft USD conversion
        shell: python
        run: |
          from pathlib import Path

          path = Path('artifacts/arvex-hosting/src/App.tsx')
          text = path.read_text(encoding='utf-8')

          old_plan = '''                plan={plan}\n                featured={i === 3}'''
          new_plan = '''                plan={{ ...plan, kind: selectedGame.slug }}\n                featured={i === 3}'''

          if old_plan not in text:
              raise SystemExit('Expected GameServerPage PlanCard block was not found; aborting without changes.')
          text = text.replace(old_plan, new_plan, 1)

          old_usd = '''        ≈ ${(Number(plan.price) / 3890).toFixed(2)} USD'''
          new_usd = '''        ≈ ${(Number(plan.price) / (plan.kind?.startsWith('minecraft-') ? 320 : 3890)).toFixed(2)} USD'''

          if old_usd not in text:
              raise SystemExit('Expected PlanCard USD conversion was not found; aborting without changes.')
          text = text.replace(old_usd, new_usd, 1)

          path.write_text(text, encoding='utf-8')
          print('Minecraft-only USD conversion patch applied.')

      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/arvex-hosting/src/App.tsx .github/workflows/one-time-minecraft-usd-fix.yml
          git rm .github/workflows/one-time-minecraft-usd-fix.yml
          git commit -m 'fix: Minecraft USD display' -m '[skip ci]'
          git push origin main
