name: ArveX visual layout patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, 'apply ArveX visual layout patch')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch home layout
        shell: python
        run: |
          from pathlib import Path
          p=Path("artifacts/arvex-hosting/src/App.tsx")
          s=p.read_text(encoding="utf-8")
          old='<h1>Powering the<br/><em>next session.</em></h1>'
          new='<h1>Build it.<br/><em>Host it.</em><br/>No interruptions.</h1>'
          if old not in s: raise SystemExit("hero marker not found")
          s=s.replace(old,new,1)
          marker='    <section className="trust-strip"><div className="container trust-inner"><span className="mono">BUILT FOR</span><div><Gamepad2 size={17}/> <span>PLAYERS</span></div><div><Code2 size={17}/> <span>BUILDERS</span></div><div><Users size={17}/> <span>TEAMS</span></div><div><ShieldCheck size={17}/> <span>OPERATORS</span></div></div></section>'
          insert='''    <section className="arx-domain-section"><div className="container arx-domain-card"><div><p className="eyebrow"><span className="eyebrow-dot"/> DOMAIN SEARCH</p><h2>Register your domain</h2><p>Secure the perfect name for your game server or community.</p></div><div className="arx-domain-input"><Search size={17}/><input placeholder="Find your perfect domain..."/><button>Search</button></div><div className="arx-tlds"><span>.com</span><span>.net</span><span>.org</span><span>.io</span><span>.gg</span><span>.dev</span></div></div></section>
    <section className="arx-home-games section"><div className="container"><SectionTitle eyebrow="GAME HOSTING" title="Hundreds of games" copy="Host the games your community plays, from Minecraft and Rust to ARK and more."/><div className="arx-game-grid">{gameCatalog.slice(0,6).map((game,i)=>{const Icon=game.icon;return <Link href={`/services/game-hosting/${game.slug}`} className="arx-game-card" key={game.slug}><div className={`arx-game-art tone-${i}`}><Icon size={34}/><span>{String(i+1).padStart(2,'0')}</span></div><div><h3>{game.title}</h3><p>{game.desc}</p><ArrowRight size={16}/></div></Link>})}</div></div></section>
'''
          if marker not in s: raise SystemExit("trust strip marker not found")
          s=s.replace(marker,marker+'\n'+insert,1)
          p.write_text(s,encoding="utf-8")
      - name: Commit and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/arvex-hosting/src/App.tsx .github/workflows/arvex-visual-layout-patch.yml
          git rm .github/workflows/arvex-visual-layout-patch.yml
          git commit -m 'apply ArveX visual layout patch'
          git push origin main
