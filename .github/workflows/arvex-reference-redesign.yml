name: ArveX reference redesign
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reference homepage redesign
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('artifacts/arvex-hosting')
          app = root / 'src/App.tsx'
          css = root / 'src/index.css'
          text = app.read_text()

          home = r'''function Home() {
            const [gameQuery, setGameQuery] = useState('');
            const games = [
              {name:'Minecraft', slug:'minecraft-java', image:'https://cdn.cloudflare.steamstatic.com/steam/apps/252490/header.jpg'},
              {name:'Rust', slug:'rust', image:'https://cdn.cloudflare.steamstatic.com/steam/apps/252490/header.jpg'},
              {name:'ARK', slug:'ark-survival-evolved', image:'https://cdn.cloudflare.steamstatic.com/steam/apps/346110/header.jpg'},
              {name:'Palworld', slug:'palworld', image:'https://cdn.cloudflare.steamstatic.com/steam/apps/1623730/header.jpg'},
              {name:'Counter-Strike 2', slug:'fivem', image:'https://cdn.cloudflare.steamstatic.com/steam/apps/730/header.jpg'},
              {name:"Garry's Mod", slug:'fivem', image:'https://cdn.cloudflare.steamstatic.com/steam/apps/4000/header.jpg'},
            ];
            const filteredGames = games.filter(g => g.name.toLowerCase().includes(gameQuery.toLowerCase()));
            return <PublicShell>
              <main className="ref-home">
                <div className="ref-promo">Get 10% off now using coupon code <b>ARVEX10</b><span>×</span></div>
                <section className="ref-hero">
                  <div className="ref-hero-grid"/>
                  <div className="ref-container">
                    <div className="ref-game-banner"><strong>HYTALE</strong><span>VIEW HYTALE SERVERS</span><Link href="/services/game-hosting">Learn More</Link><i>✦</i></div>
                    <h1>Build it, Host it.<br/><span>No interruptions.</span></h1>
                    <p>High-performance game hosting built for players who demand speed, stability, and total control — no lag, no limits.</p>
                    <div className="ref-hero-actions"><Link href="/services/game-hosting" className="ref-text-btn">View Prices <ArrowRight size={15}/></Link><Link href="/dashboard" className="ref-white-btn">Get Started <ArrowRight size={15}/></Link></div>
                    <div className="ref-sparkles">✦　✧　✦</div>
                    <div className="ref-trust"><span>el.</span><span>NEO PROTECT</span><span>PTERODACTYL</span><span>SAMSUNG</span><span>HETZNER</span></div>
                  </div>
                </section>

                <section className="ref-container ref-domain-wrap">
                  <div className="ref-domain-card"><div><h2>Register Your Domain</h2><p>Secure the perfect domain for your game server or community.</p></div><div className="ref-domain-search"><Search size={18}/><input placeholder="Find your perfect domain..."/><button>Search</button></div><div className="ref-tlds"><span>.com</span><span>.net</span><span>.org</span><span>.io</span><span>.gg</span><span>.dev</span></div></div>
                </section>

                <section className="ref-section ref-container">
                  <div className="ref-section-head"><div><h2>Hundreds of Games</h2><p>Host any game that comes to your mind here at ArveX.</p></div><div className="ref-game-search"><Search size={16}/><input value={gameQuery} onChange={e=>setGameQuery(e.target.value)} placeholder="Search for a game"/></div></div>
                  <div className="ref-game-grid">{filteredGames.map((g)=><Link href={`/services/game-hosting/${g.slug}`} key={g.name} className="ref-game-card"><div className="ref-game-image" style={{backgroundImage:`url(${g.image})`}}><div className="ref-game-overlay"><b>{g.name}</b><span>GAME SERVER</span></div></div></Link>)}</div>
                </section>

                <section className="ref-section ref-location-section"><div className="ref-container"><div className="ref-section-rule"><span>⌖</span></div><div className="ref-center-title"><h2>Global Server Locations</h2><p>Strategically placed servers worldwide for minimal latency and maximum performance.</p></div><div className="ref-map"><div className="map-dot dot-us"/><div className="map-dot dot-de"/><div className="map-dot dot-sg"/><div className="map-dot dot-au"/><span className="map-pill pill-us">▥ 🇺🇸 United States</span><span className="map-pill pill-de">▥ 🇩🇪 Germany</span><span className="map-pill pill-sg">▥ 🇸🇬 Singapore</span><span className="map-pill pill-au">▥ 🇦🇺 Australia</span></div><div className="ref-feature-grid">{[['Instant Setup','Get your server up and running in seconds. No complicated configurations.'],['DDoS Protection','Enterprise protection keeps your server online and secure against any attack.'],['99.9% Uptime','Our redundant infrastructure ensures your server stays online.'],['24/7 Support','Expert support team available around the clock to help with any issues.'],['Powerful Hardware','High-performance NVMe SSDs and latest-gen CPUs for lag-free gaming.'],['Global Locations','Multiple data centers worldwide to ensure low latency for all players.']].map(([t,d])=><div className="ref-feature" key={t}><span>◈</span><div><h3>{t}</h3><p>{d}</p></div></div>)}</div></div></section>

                <section className="ref-section ref-value"><div className="ref-container"><h2>Unmatched Speed, Incredible Value.</h2><p>Experience powerhouse performance with modern AMD servers. Lightning-fast spin-ups, dependable uptime, and the value to make every gaming session seamless.</p><div className="ref-provider-table"><div className="ref-table-head"><span>Provider</span><span>Price</span><span>Processor</span><span>Storage</span><span>24/7 Support</span><span>DDoS Protection</span></div><div className="ref-table-row"><b>ArveX Hosting</b><span>BEST VALUE</span><span>AMD Ryzen</span><span>NVMe SSD</span><span>✓</span><span>✓</span></div></div></div></section>

                <section className="ref-section ref-blog ref-container"><div className="ref-section-head"><div><h2>Latest from Our Blog</h2><p>Stay updated with tutorials, tips, and news about game server hosting.</p></div><div className="ref-tabs"><span className="active">All</span><span>Guides</span><span>Security</span><span>Updates</span></div></div><div className="ref-blog-grid"><article><div className="ref-blog-img blog-one"/><small>Guides · Jan 15, 2025 · 6 min read</small><h3>Getting Started with Minecraft Server Hosting</h3><p>Learn how to set up your first Minecraft server and customize it for your friends.</p><button>Read More →</button></article><article><div className="ref-blog-img blog-two"/><small>Guides · Jan 12, 2025 · 7 min read</small><h3>Top 100 Minecraft Plugins for 2025</h3><p>Discover the best plugins to enhance your Minecraft server experience this year.</p><button>Read More →</button></article><article><div className="ref-blog-img blog-three"/><small>Security · Jan 10, 2025 · 4 min read</small><h3>How to defend yourself from a DDoS attack</h3><p>Why DDoS protection is crucial for your game server and how it works.</p><button>Read More →</button></article></div></section>

                <section className="ref-switch"><div className="ref-container"><h2>Make The Switch</h2><p>Join thousands of gamers who switched to faster, more reliable hosting. Experience the difference today.</p><strong>SAVE 10%</strong><span>USE COUPON CODE</span><b>ARVEX10</b><div className="ref-countdown"><i>00</i><i>14</i><i>45</i><i>16</i></div></div></section>
              </main>
            </PublicShell>;
          }

          '''

          pattern = r'function Home\(\) \{.*?(?=function ServicesPage\(\) \{)'
          new_text, n = re.subn(pattern, home, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Home function anchor not found')
          app.write_text(new_text)

          extra = r'''

/* Reference-inspired ArveX homepage — isolated so existing service/game routes remain untouched. */
.ref-home{background:#0b0b0b;color:#f4f4f4;overflow:hidden;font-family:var(--app-font-sans)}
.ref-container{width:min(1180px,calc(100% - 32px));margin:0 auto}.ref-promo{height:36px;background:#202020;color:#aaa;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px}.ref-promo b{color:#fff}.ref-promo span{position:absolute;right:18px;font-size:16px;color:#777}
.ref-hero{position:relative;text-align:center;min-height:690px;padding:32px 0 0;background:#0a0a0a}.ref-hero-grid{position:absolute;inset:0;opacity:.28;background-image:linear-gradient(#262626 1px,transparent 1px),linear-gradient(90deg,#262626 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,#000,transparent 85%)}
.ref-game-banner{position:relative;z-index:1;width:min(820px,100%);height:78px;margin:0 auto 48px;border-radius:16px;background:linear-gradient(90deg,#1d3c24,#253c1f 40%,#171717 70%,#222);border:1px solid #303030;display:flex;align-items:center;justify-content:center;gap:22px;box-shadow:0 18px 50px #000}.ref-game-banner strong{font:800 35px Georgia;color:#dfe7d7;letter-spacing:.08em}.ref-game-banner span{font-size:12px;font-weight:800;letter-spacing:.08em}.ref-game-banner a{background:#fff;color:#111;border-radius:24px;padding:10px 18px;font-weight:700;font-size:12px}.ref-game-banner i{color:#fff;position:absolute;right:14px;top:10px}
.ref-hero h1{position:relative;z-index:1;font-size:clamp(48px,7vw,86px);line-height:1.02;letter-spacing:-.05em;margin:0 auto 20px;font-weight:500}.ref-hero h1 span{font-weight:500}.ref-hero p{position:relative;z-index:1;max-width:560px;margin:0 auto;color:#8e8e8e;line-height:1.65;font-size:15px}.ref-hero-actions{position:relative;z-index:1;display:flex;justify-content:center;align-items:center;gap:20px;margin-top:32px}.ref-text-btn{color:#ddd;font-size:13px;display:flex;gap:8px;align-items:center}.ref-white-btn{background:#fff;color:#111;padding:13px 20px;border-radius:10px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}.ref-sparkles{color:#fff;font-size:20px;margin-top:-3px}.ref-trust{position:relative;z-index:1;display:flex;justify-content:space-around;align-items:center;gap:20px;margin:88px auto 0;max-width:900px;color:#454545;font-size:12px;font-weight:800;letter-spacing:.06em}.ref-trust span:first-child{font-size:24px;color:#505050}
.ref-domain-wrap{margin-top:-1px}.ref-domain-card{min-height:228px;border-radius:22px;background:#f7f7f4;color:#111;padding:42px 38px 30px;position:relative;overflow:hidden}.ref-domain-card:after{content:'';position:absolute;right:-20px;top:0;width:340px;height:100%;opacity:.08;background:radial-gradient(circle at 70% 50%,#777 1px,transparent 1.5px);background-size:9px 9px}.ref-domain-card h2{font-size:32px;font-weight:500;margin:0 0 6px}.ref-domain-card p{margin:0 0 22px;color:#777;font-size:13px}.ref-domain-search{height:48px;border:1px solid #ddd;border-radius:9px;display:flex;align-items:center;gap:10px;padding:0 10px;max-width:640px;background:#fff;position:relative;z-index:1}.ref-domain-search input{border:0;outline:0;flex:1;color:#222;background:transparent;font-size:12px}.ref-domain-search button{border:0;background:#111;color:#fff;border-radius:22px;padding:9px 19px;font-size:12px;font-weight:700}.ref-tlds{display:flex;gap:10px;margin-top:12px;position:relative;z-index:1}.ref-tlds span{padding:7px 14px;border-radius:18px;background:#ecece8;font-size:11px;font-weight:700;color:#444}
.ref-section{padding:92px 0}.ref-section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:34px}.ref-section h2{font-size:42px;font-weight:500;letter-spacing:-.04em;margin:0 0 8px}.ref-section-head p,.ref-value p,.ref-center-title p{color:#777;font-size:13px;margin:0;line-height:1.6}.ref-game-search{display:flex;align-items:center;gap:8px;width:290px;height:42px;border:1px solid #2b2b2b;border-radius:22px;padding:0 14px}.ref-game-search input{flex:1;background:transparent;border:0;outline:0;color:#ddd;font-size:12px}.ref-game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.ref-game-card{height:126px;border-radius:9px;overflow:hidden;border:1px solid #202020;background:#171717}.ref-game-image{height:100%;background-size:cover;background-position:center;position:relative;transition:transform .3s}.ref-game-card:hover .ref-game-image{transform:scale(1.04)}.ref-game-overlay{position:absolute;inset:auto 0 0;padding:28px 18px 14px;background:linear-gradient(transparent,rgba(0,0,0,.9));display:flex;justify-content:space-between;align-items:end}.ref-game-overlay b{font-size:17px}.ref-game-overlay span{font-size:9px;color:#aaa;letter-spacing:.12em}
.ref-location-section{background:#0b0b0b}.ref-section-rule{display:flex;align-items:center;gap:18px;justify-content:center;color:#aaa}.ref-section-rule:before,.ref-section-rule:after{content:'';height:1px;background:#333;width:38%}.ref-section-rule span{font-size:26px}.ref-center-title{text-align:center;margin:20px auto 25px}.ref-center-title h2{margin-bottom:7px}.ref-map{height:380px;position:relative;margin:0 auto;background:radial-gradient(ellipse at center,#1b1b1b 0,#0b0b0b 62%);overflow:hidden;border-radius:24px}.ref-map:before{content:'';position:absolute;inset:28px;background-image:radial-gradient(#393939 1px,transparent 1.4px);background-size:7px 7px;opacity:.6;clip-path:polygon(4% 28%,18% 12%,30% 20%,42% 14%,56% 20%,70% 12%,86% 24%,96% 45%,88% 55%,92% 75%,76% 82%,66% 67%,53% 80%,42% 67%,28% 80%,20% 62%,9% 70%,4% 45%)}.map-dot{position:absolute;width:7px;height:7px;border-radius:50%;background:#15c4ff;box-shadow:0 0 18px #15c4ff;z-index:2}.dot-us{left:14%;top:45%}.dot-de{left:50%;top:37%}.dot-sg{left:66%;top:58%}.dot-au{right:8%;top:73%}.map-pill{position:absolute;z-index:3;background:#373737;border:1px solid #4b4b4b;color:#ddd;padding:8px 13px;border-radius:20px;font-size:11px}.pill-us{left:17%;top:43%}.pill-de{left:43%;top:32%}.pill-sg{left:61%;top:55%}.pill-au{right:13%;top:70%}
.ref-feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:24px}.ref-feature{min-height:100px;border:1px solid #252525;border-radius:12px;padding:22px;display:flex;gap:14px;background:linear-gradient(135deg,#111,#0d0d0d)}.ref-feature span{font-size:22px;color:#eee}.ref-feature h3{margin:0 0 5px;font-size:14px}.ref-feature p{margin:0;color:#777;font-size:11px;line-height:1.55}
.ref-value{background:#111}.ref-value h2{margin-bottom:8px}.ref-provider-table{margin-top:34px;border:1px solid #272727;border-radius:14px;overflow:hidden}.ref-table-head,.ref-table-row{display:grid;grid-template-columns:1.4fr .9fr 1.2fr 1.1fr .9fr 1fr;gap:10px;padding:18px 20px;align-items:center;font-size:11px}.ref-table-head{color:#888;background:#151515}.ref-table-row{background:#0e0e0e;color:#ddd}.ref-table-row span:nth-child(2){color:#fff;font-size:9px;border:1px solid #444;border-radius:12px;padding:4px 7px;width:max-content}
.ref-blog{padding-bottom:90px}.ref-tabs{display:flex;border:1px solid #2b2b2b;border-radius:22px;padding:3px}.ref-tabs span{padding:8px 15px;color:#888;font-size:11px}.ref-tabs .active{background:#fff;color:#111;border-radius:18px}.ref-blog-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ref-blog article{background:#191919;border:1px solid #242424;border-radius:14px;overflow:hidden;padding-bottom:18px}.ref-blog article:last-child{grid-column:1}.ref-blog-img{height:180px;background-size:cover;background-position:center}.blog-one{background:linear-gradient(135deg,#b4c69a,#4e6040)}.blog-two{background:linear-gradient(135deg,#6c7a3d,#111)}.blog-three{background:linear-gradient(135deg,#0b79a5,#0e1c2b)}.ref-blog article small,.ref-blog article h3,.ref-blog article p{display:block;margin-left:18px;margin-right:18px}.ref-blog article small{color:#777;font-size:9px;margin-top:16px}.ref-blog article h3{font-size:16px;margin-top:10px}.ref-blog article p{font-size:11px;color:#777;line-height:1.55}.ref-blog article button{margin-left:18px;background:#fff;color:#111;border:0;border-radius:8px;padding:10px 14px;font-size:11px;font-weight:700}
.ref-switch{text-align:center;padding:110px 0 120px;background:radial-gradient(circle at center,#191919 0,#0b0b0b 58%)}.ref-switch h2{font-size:44px;font-weight:500;margin-bottom:10px}.ref-switch p{max-width:520px;margin:0 auto 36px;color:#777;font-size:13px;line-height:1.6}.ref-switch strong{display:block;font-size:32px}.ref-switch span,.ref-switch b{display:block;font-size:10px;letter-spacing:.15em;color:#777;margin-top:7px}.ref-switch b{color:#fff}.ref-countdown{display:flex;justify-content:center;gap:14px;margin-top:22px}.ref-countdown i{font-style:normal;font:28px var(--app-font-mono);padding:12px 14px;border:1px solid #252525;border-radius:8px;background:#111}
@media(max-width:760px){.ref-game-banner{height:66px;gap:10px;margin-bottom:34px}.ref-game-banner strong{font-size:24px}.ref-game-banner span{font-size:9px}.ref-game-banner a{padding:8px 11px}.ref-hero{min-height:570px}.ref-trust{margin-top:58px;flex-wrap:wrap;font-size:9px}.ref-domain-card{padding:28px 20px}.ref-domain-card h2{font-size:26px}.ref-section{padding:64px 0}.ref-section-head{display:block}.ref-game-search{margin-top:20px;width:100%}.ref-game-grid{grid-template-columns:1fr}.ref-game-card{height:150px}.ref-map{height:280px}.ref-feature-grid,.ref-blog-grid{grid-template-columns:1fr}.ref-blog article:last-child{grid-column:auto}.ref-table-head,.ref-table-row{grid-template-columns:repeat(3,1fr);font-size:9px}.ref-table-head span:nth-child(n+4),.ref-table-row span:nth-child(n+4){display:none}.ref-switch h2{font-size:34px}}
'''
          css.write_text(css.read_text() + extra)
          print('Applied reference homepage redesign')
          PY
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/arvex-hosting/src/App.tsx artifacts/arvex-hosting/src/index.css
          git diff --cached --quiet && exit 0
          git commit -m "feat: rebuild homepage to match reference design"
          git push
